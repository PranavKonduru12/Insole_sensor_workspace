CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_ADC=y
CONFIG_GPIO=y

# Disable console output so UART activity does not affect the measurement.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n

# Completely exclude the Bluetooth host, controller, and NUS service.
CONFIG_BT=n
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_NUS=n
CONFIG_BT_NUS_SECURITY_ENABLED=n

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ASSERT=y

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
